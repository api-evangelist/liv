name: LIV
description: >-
  LIV is an XR video capture and live-streaming platform whose flagship product,
  the LIV Camera Kit (LCK), is a game-engine SDK for Unity and Unreal Engine. It
  lets extended-reality apps on Meta Quest and PCVR embed user-spawnable in-game
  cameras for recording video, capturing screenshots, and live streaming to
  YouTube, Twitch, and custom RTMP endpoints - with no external capture hardware
  or software. An official Meta Quest partner, LIV ships first-party Unity and
  Unreal SDKs, a Developer Dashboard for SDK downloads and Tracking IDs, a LIV
  Hub device-login flow for streaming and subscriptions, and a desktop LIV App
  URI/command API for mixed-reality capture. The SDK is free for developers and
  is used by apps serving millions of monthly active users.
